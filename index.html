<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ColorBite POS</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#1d1b19;--mu:#6d675f;--bd:#e3ded7;--ac:#d9381e;--ok:#1f8a4c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#232019;--tx:#f2eee8;--mu:#a39b90;--bd:#3a352d;--ac:#ff5a3c;--ok:#4cc27d}}
:root[data-theme="dark"]{--bg:#171513;--card:#232019;--tx:#f2eee8;--mu:#a39b90;--bd:#3a352d;--ac:#ff5a3c;--ok:#4cc27d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{margin:0;font-size:20px;letter-spacing:.12em}
.bar button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pri{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important;font-weight:600}
.main{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:860px){.main{grid-template-columns:1fr}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:18px 0 8px}
h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--tx);font:inherit}
.item:hover{border-color:var(--ac)}
.item b{display:block}.item small{color:var(--mu);display:block;margin-top:2px}
.item .p{float:right;font-weight:600;color:var(--ac)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em}
.order{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;position:sticky;top:8px;align-self:start}
.row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bd)}
.row .n{flex:1}.row .q{display:flex;align-items:center;gap:4px}
.row .q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700;padding-top:8px}
.mu{color:var(--mu);font-size:13px}
#st{min-height:20px;margin:8px 0;font-size:13px;color:var(--mu)}
#st.err{color:var(--ac)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:400px}
.box input{width:100%;font:inherit;font-size:20px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:6px 0 10px}
.seg{display:flex;gap:8px;margin:8px 0}.seg .btn{flex:1}.seg .on{border-color:var(--ac);background:var(--ac);color:#fff}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.bb{height:6px;background:var(--ac);border-radius:3px;margin-top:3px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9381e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ColorBite">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<header>
<h1>COLORBITE POS</h1>
<div class="bar">
<span class="mu" id="rate"></span>
<button id="cur" title="F3">💱 USD</button>
<button id="logb">📊 Sales log</button>
<button id="clr" title="F1">New / Clear</button>
</div>
</header>
<div class="main">
<div id="menu"></div>
<aside class="order">
<h2>Current order</h2>
<div id="lines"></div>
<div id="st"></div>
<div class="tot"><span>Total (USD)</span><span id="tu">$0.00</span></div>
<div class="tot"><span>Total (LBP)</span><span id="tl">0 LBP</span></div>
<button class="btn pri" id="pay" style="width:100%;margin-top:12px;padding:12px" title="F7">PAY / CHECKOUT 💵</button>
<p class="mu">Shortcuts: F1 clear · F3 currency · F7 pay</p>
</aside>
</div>
<div class="modal" id="m"><div class="box" id="mb"></div></div>
<script>
const RATE=90000;
const BURGERS=[
{id:"1",e:"🔴",n:"Crimson Beast",t:"RED — Sweet & Spicy",d:"Beef patty, smoked cheddar, crispy onions, jalapeños, smoky chili sauce, red bun.",p:7.222222222222222},
{id:"2",e:"🟡",n:"Golden Melt",t:"YELLOW — Extra Cheesy",d:"Double beef, American cheese, crispy cheese, caramelized onions, mustard mayo, yellow bun.",p:7.222222222222222},
{id:"3",e:"🟣",n:"Purple Haze",t:"PURPLE — Sweet & Smoky",d:"Beef patty, brie cheese, caramelized onions, purple cabbage slaw, blueberry BBQ sauce, purple bun.",p:8.888888888888889},
{id:"4",e:"🔵",n:"Blue Thunder",t:"BLUE — Bold & Creamy",d:"Beef patty, blue cheese, crispy onions, lettuce, garlic sauce, blue bun.",p:8.333333333333333},
{id:"5",e:"⚫",n:"Blackout",t:"BLACK — Dark BBQ",d:"Double beef, smoked cheddar, crispy onions, bacon, black garlic BBQ sauce, black bun.",p:8.888888888888889}];
const SIDES=[
{id:"S1",n:"CHEDDAR",p:.5},{id:"S2",n:"BBQ / BLUEBERRY BBQ",p:.5},{id:"S3",n:"RANCH",p:.5},
{id:"S4",n:"FRIES",p:3},
{id:"CB",n:"COMBO",p:2,d:"Sauce + fries + drink"}];
const DRINKS = ["7UP", "7UP DIET", "PEPSI", "PEPSI DIET", "PEPSI ZERO", "MIRANDA", "ICETEA", "WATER", "SPARKLING WATER"].map((n, i) => {
  let price = 1;
  if (n === "WATER") price = 0.35;
  if (n === "SPARKLING WATER") price = 0.5;
  
  return { id: "D" + (i + 1), n, p: price };
});
const ALL=[...BURGERS.map(b=>({...b,type:"burger"})),...SIDES.map(s=>({...s,type:"side"})),...DRINKS.map(d=>({...d,type:"drink"}))];
let basket={},lbp=false,tender="usd";
const $=id=>document.getElementById(id);
const fmt=u=>lbp?Math.round(u*RATE).toLocaleString("en-US")+" LBP":"$"+u.toFixed(2);
const usd=u=>"$"+u.toFixed(2),lbpf=u=>Math.round(u*RATE).toLocaleString("en-US")+" LBP";
function status(m,err){const s=$("st");s.textContent=m;s.className=err?"err":""}
function btn(i){return `<button class="item" data-id="${i.id}"><span class="p">${fmt(i.p)}</span><b>${i.e||""} ${i.n}</b>${i.t?`<span class="tag">${i.t}</span>`:""}${i.d?`<small>${i.d}</small>`:""}</button>`}
function renderMenu(){
$("menu").innerHTML="<h2>Burgers</h2><div class='grid'>"+BURGERS.map(btn).join("")+"</div><h2>Sauces / Sides</h2><div class='grid'>"+SIDES.map(btn).join("")+"</div><h2>Drinks</h2><div class='grid'>"+DRINKS.map(btn).join("")+"</div>";
}
function total(){return Object.entries(basket).reduce((s,[id,q])=>s+ALL.find(i=>i.id===id).p*q,0)}
function renderOrder(){
const ids=Object.keys(basket);
$("lines").innerHTML=ids.length?ids.map(id=>{const i=ALL.find(x=>x.id===id),q=basket[id];
return `<div class="row"><span class="n">${i.n}<br><span class="mu">${fmt(i.p)} each</span></span><span class="q"><button data-m="${id}">−</button>${q}<button data-a="${id}">+</button></span><b style="min-width:70px;text-align:right">${fmt(i.p*q)}</b></div>`}).join(""):'<p class="mu" style="text-align:center">[Empty order basket]</p>';
const t=total();$("tu").textContent=usd(t);$("tl").textContent=lbpf(t);
$("rate").textContent="1 USD = "+RATE.toLocaleString("en-US")+" LBP";
$("cur").textContent="💱 "+(lbp?"LBP":"USD");
}
function add(id){
const i=ALL.find(x=>x.id===id);
if(id==="CB"){
const b=ALL.reduce((s,x)=>s+(x.type==="burger"?(basket[x.id]||0):0),0),c=basket.CB||0;
if(!b)return status("COMBO can only be applied to burgers. Add a burger first!",1);
if(c>=b)return status(`Cannot add more combos than burgers (${b} burger(s), ${c} combo(s)).`,1);
}
basket[id]=(basket[id]||0)+1;status("Added "+i.n+".");renderOrder();
}
function remove(id){
basket[id]--;if(basket[id]<=0)delete basket[id];
// keep combos <= burgers
const b=BURGERS.reduce((s,x)=>s+(basket[x.id]||0),0);
if((basket.CB||0)>b){basket.CB=b;if(!b)delete basket.CB;status("Combo count reduced to match burgers.")}
renderOrder();
}
function clearAll(){basket={};status("Order cleared.");renderOrder()}
function pay(){
const t=total();if(!t)return status("Basket empty! Add items before payment.",1);
tender="usd";
$("m").classList.add("on");
$("mb").innerHTML=`<h2>Cashier checkout</h2>
<div class="kv"><span>Total (USD)</span><b>${usd(t)}</b></div>
<div class="kv"><span>Total (LBP)</span><b>${lbpf(t)}</b></div>
<div class="seg"><button class="btn on" id="t1">USD cash</button><button class="btn" id="t2">LBP cash</button></div>
<label class="mu">Cash amount received</label>
<div id="quick" class="seg" style="flex-wrap:wrap"></div>
<input id="amt" inputmode="decimal" placeholder="Leave empty for exact amount">
<div id="res"></div>
<div class="seg"><button class="btn" id="cx">Cancel</button><button class="btn pri" id="ok">Confirm</button></div>`;
const quick=()=>{const u=tender==="usd",steps=u?[1,5,10,20]:[50000,100000,500000,1000000],tv=u?t:Math.ceil(t*RATE),opts=[tv];
steps.forEach(s=>{const r=Math.ceil(tv/s-1e-9)*s;if(!opts.includes(r))opts.push(r)});
$("quick").innerHTML=opts.map((v,i)=>`<button class="btn" data-v="${v}">${i?"":"Exact "}${u?usd(v):v.toLocaleString("en-US")+" LBP"}</button>`).join("");
$("quick").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("amt").value=b.dataset.v;$("quick").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")})};
$("t1").onclick=()=>{tender="usd";$("t1").classList.add("on");$("t2").classList.remove("on");$("amt").value="";quick()};
$("t2").onclick=()=>{tender="lbp";$("t2").classList.add("on");$("t1").classList.remove("on");$("amt").value="";quick()};
quick();
$("cx").onclick=()=>$("m").classList.remove("on");
$("ok").onclick=()=>{
const raw=parseFloat(($("amt").value||"").replace(/,/g,""));
const tendered=isNaN(raw)?(tender==="usd"?t:t*RATE):raw;
const paidUsd=tender==="usd"?tendered:tendered/RATE,chg=paidUsd-t;
if(chg<-0.0001){$("res").innerHTML=`<p class="mu" style="color:var(--ac)">Short by ${usd(-chg)} / ${lbpf(-chg)}</p>`;return}
logSale(t);
$("mb").innerHTML=`<h2>Transaction receipt</h2>
<div class="kv"><span>Total</span><b>${usd(t)} · ${lbpf(t)}</b></div>
<div class="kv"><span>Paid in ${tender.toUpperCase()}</span><b>${tender==="usd"?usd(tendered):Math.round(tendered).toLocaleString("en-US")+" LBP"}</b></div>
<div class="kv" style="color:var(--ok);font-size:18px"><span>CHANGE DUE</span><b>${usd(chg)}</b></div>
<div class="kv"><span></span><b>${lbpf(chg)}</b></div>
<button class="btn pri" id="nw" style="width:100%;margin-top:12px;padding:12px">Start new order</button>`;
$("nw").onclick=()=>{$("m").classList.remove("on");basket={};status("Ready for input.");renderOrder()};
};
}
document.addEventListener("click",e=>{
const t=e.target.closest("button");if(!t)return;
if(t.dataset.id)add(t.dataset.id);
else if(t.dataset.a)add(t.dataset.a);
else if(t.dataset.m)remove(t.dataset.m);
});
$("cur").onclick=()=>{lbp=!lbp;renderMenu();renderOrder();status("Switched currency display.")};
$("clr").onclick=clearAll;$("pay").onclick=pay;
document.addEventListener("keydown",e=>{
if($("m").classList.contains("on"))return;
if(e.key==="F1"){e.preventDefault();clearAll()}
if(e.key==="F3"){e.preventDefault();$("cur").click()}
if(e.key==="F7"){e.preventDefault();pay()}
});
let sales=[];
try{sales=JSON.parse(localStorage.getItem("cbsales")||"[]")}catch(e){}
function saveSales(){try{localStorage.setItem("cbsales",JSON.stringify(sales))}catch(e){}}
function logSale(t){sales.push({ts:Date.now(),items:{...basket},total:t});saveSales()}
function showLog(range){
const d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
const list=range==="today"?sales.filter(s=>s.ts>=start):sales;
const agg={};let rev=0;
list.forEach(s=>{rev+=s.total;for(const id in s.items)agg[id]=(agg[id]||0)+s.items[id]});
const rows=Object.entries(agg).map(([id,q])=>{const i=ALL.find(x=>x.id===id);return{n:(i.e||"")+" "+i.n,q,r:q*i.p}}).sort((a,b)=>b.q-a.q);
const max=rows.length?rows[0].q:1;
$("m").classList.add("on");
$("mb").innerHTML=`<div style="max-height:85vh;overflow:auto"><h2>Sales log — best sellers</h2>
<div class="seg"><button class="btn ${range==="today"?"on":""}" id="lt">Today</button><button class="btn ${range==="today"?"":"on"}" id="la">All time</button></div>
<div class="kv"><span>Orders</span><b>${list.length}</b></div>
<div class="kv"><span>Revenue</span><b>${usd(rev)} · ${lbpf(rev)}</b></div>
<h2>Items sold</h2>
${rows.length?rows.map((r,k)=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd)"><div class="kv"><span>${k+1}. ${r.n}</span><b>${r.q} sold · ${usd(r.r)}</b></div><div class="bb" style="width:${r.q/max*100}%"></div></div>`).join(""):'<p class="mu">No sales recorded yet.</p>'}
<div class="seg" style="margin-top:14px"><button class="btn" id="lc">Close</button><button class="btn" id="ld" hidden>Download CSV</button><button class="btn" id="lx">Clear log</button></div></div>`;
$("lt").onclick=()=>showLog("today");$("la").onclick=()=>showLog("all");
$("lc").onclick=()=>$("m").classList.remove("on");
const show=dl=>{const b=$("ld");if(dl&&b){b.hidden=false;b.onclick=()=>exportCsv(list,range,dl)}};
if(window.claude&&claude.use){try{claude.use("downloads").then(show).catch(()=>{})}catch(e){}}
else show({save:o=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([o.data],{type:"text/csv;charset=utf-8"}));a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}});
$("lx").onclick=function(){if(this.dataset.s){sales=[];saveSales();showLog(range)}else{this.dataset.s=1;this.textContent="Tap again to confirm"}};
}
function exportCsv(list,range,dl){
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
const rows=["Date,Time,Order #,Item,Qty,Unit price (USD),Line total (USD)"],tot={};
list.forEach(s=>{const dt=new Date(s.ts),date=dt.toLocaleDateString("en-CA"),time=dt.toLocaleTimeString("en-GB"),no=sales.indexOf(s)+1;
for(const id in s.items){const i=ALL.find(x=>x.id===id),n=s.items[id];rows.push([date,time,no,q(i.n),n,i.p.toFixed(2),(i.p*n).toFixed(2)].join(","));tot[id]=(tot[id]||0)+n}});
const ids=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]);
if(!ids.length){status("Nothing to download yet.",1);return}
rows.push("");
let gq=0,gr=0;
ids.forEach((id,k)=>{const i=ALL.find(x=>x.id===id),n=tot[id];gq+=n;gr+=i.p*n;rows.push([k?"":q("TOTAL"),"","",q(i.n),n,i.p.toFixed(2),(i.p*n).toFixed(2)].join(","))});
rows.push([q("GRAND TOTAL"),"",list.length,"",gq,"",gr.toFixed(2)].join(","));
dl.save({filename:"colorbite-sales-"+range+"-"+new Date().toLocaleDateString("en-CA")+".csv",data:"\ufeff"+rows.join("\n")}).catch(()=>{});
}
$("logb").onclick=()=>showLog("today");
renderMenu();renderOrder();status("Ready for input.");
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
